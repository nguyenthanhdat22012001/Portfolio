name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:claims

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/motion.spec.ts e2e/hero-3d.spec.ts e2e/hero-3d-no-webgl.spec.ts e2e/about-avatar.spec.ts

      - run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
