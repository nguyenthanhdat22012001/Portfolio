name: Lighthouse (preview)

on:
  deployment_status:

permissions:
  contents: read

jobs:
  lighthouse-preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - name: Require the Vercel protection bypass secret
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set. Without it Lighthouse would audit the Vercel login page, not the preview."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect (mobile, 3 runs per URL)
        id: collect
        env:
          BASE: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          BASE="${BASE%/}"
          pnpm exec lhci collect --no-lighthouserc \
            --url="$BASE/en" \
            --url="$BASE/vi" \
            --url="$BASE/en/work/oneloyalty-layered-architecture" \
            --url="$BASE/vi/work/safebulk-bulk-editor" \
            --numberOfRuns=3 \
            --settings.extraHeaders="{\"x-vercel-protection-bypass\":\"$BYPASS\",\"x-vercel-skip-toolbar\":\"1\"}"
      - name: Assert (same thresholds as the local run)
        run: pnpm exec lhci assert --config=./lighthouserc.json
      - if: always() && steps.collect.outcome != 'skipped'
        run: pnpm exec lhci upload --target=filesystem --outputDir=.lighthouseci
      # Lighthouse keeps configSettings.extraHeaders, bypass secret included,
      # in every LHR (.json and the JSON embedded in .html). Scrub it before
      # anything leaves the runner; the artifact uploads only if this passed.
      - name: Scrub the bypass secret from the reports
        id: scrub
        if: always() && steps.collect.outcome != 'skipped'
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::error::No bypass secret to scrub."
            exit 1
          fi
          mkdir -p .lighthouseci
          find .lighthouseci -type f -exec perl -pi -e 's/\Q$ENV{BYPASS}\E/[redacted]/g' {} +
          if grep -rqF -- "$BYPASS" .lighthouseci; then
            echo "::error::The bypass secret is still in .lighthouseci; not uploading."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: lighthouse-preview-report
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
